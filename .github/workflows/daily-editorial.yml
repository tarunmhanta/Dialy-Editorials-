name: Daily Editorial Pipeline

on:
  schedule:
    # 8:00 AM IST (UTC+5:30) = 02:30 AM UTC
    - cron: '30 2 * * *'
  workflow_dispatch:

# Minimum permissions needed to write JSON data commits back to repository
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'automation/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Run Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python automation/main.py

      - name: Check for Data Changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Data files updated during pipeline run."
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No data file changes detected."
          fi

      - name: Commit and Push Data Updates
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: add daily editorial analysis [skip ci]"
          git push origin main

name: Daily Editorial Pipeline & Deployment

on:
  schedule:
    # 7:00 AM IST (UTC+5:30) = 01:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

# Permissions needed to commit JSON updates and deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-pipeline'
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.git-check.outputs.changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'automation/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Run Automation Pipeline
        id: run-pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python automation/main.py
          EXIT_CODE=$?
          echo "Pipeline exited with code: $EXIT_CODE"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "pipeline_result=new_editorial" >> $GITHUB_OUTPUT
            echo "✅ SUCCESS: New editorial was processed and saved!"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "pipeline_result=up_to_date" >> $GITHUB_OUTPUT
            echo "ℹ️ Database is already up to date with the latest editorials."
          else
            echo "pipeline_result=error" >> $GITHUB_OUTPUT
            echo "❌ ERROR: Pipeline failed with exit code $EXIT_CODE!"
            exit 1
          fi

      - name: Check for Data Changes
        id: git-check
        run: |
          CHANGES=$(git status --porcelain data/)
          echo "Porcelain output: '$CHANGES'"
          if [ -n "$CHANGES" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✅ Data files were updated during pipeline run!"
            git diff --stat data/ || true
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No data file changes detected."
          fi

      - name: Commit and Push Data Updates
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git status
          git commit -m "chore: auto-add daily editorial analysis $(date +'%Y-%m-%d')"
          git push origin main
          echo "✅ Data changes committed and pushed to main!"

  deploy-pages:
    needs: run-pipeline
    if: always() && needs.run-pipeline.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Latest main after pipeline commit)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
